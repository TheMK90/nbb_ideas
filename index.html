<body>
  <header class="topbar">
    <div class="brand">NBB</div>
    <h1>Bank Ideas</h1>
  </header>

  <main>
    <section class="card">
      <h2>Submit an idea</h2>
      <form id="idea-form">
        <input id="title" placeholder="Idea title" required maxlength="80" />
        <textarea id="description" placeholder="Describe your idea" required rows="3"></textarea>
        <input id="author" placeholder="Your name" required maxlength="40" />
        <button type="submit">Submit idea</button>
      </form>
    </section>

    <section>
      <h2>Ideas <span id="count" class="muted"></span></h2>
      <div id="ideas"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
